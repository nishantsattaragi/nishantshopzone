<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            Shop<span>Zone</span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput"
                   placeholder="Search for products...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="cart-icon" id="cartButton">
            🛒 Cart
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Amazing Products</h1>
            <p>Shop your favorites at the best prices!</p>
            <a href="#products" class="shop-btn">Shop Now</a>
        </div>
    </section>

    <!-- Product Section -->
    <section class="products-section" id="products">

        <h2>Our Latest Products</h2>
        <p class="section-description">
            Explore our exclusive collection
        </p>

        <div class="product-container" id="productContainer">
            <!-- Products will be loaded dynamically using JavaScript -->
        </div>

    </section>

    <!-- Shopping Cart Section -->
    <section class="cart-section" id="cartSection">

        <div class="cart-heading">
            <h2>Shopping Cart</h2>
            <button id="closeCart">Close ✕</button>
        </div>

        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-total">
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button id="clearCart">Clear Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <h3>ShopZone</h3>
        <p>Your one-stop destination for online shopping.</p>
        <p>&copy; 2026 ShopZone. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
